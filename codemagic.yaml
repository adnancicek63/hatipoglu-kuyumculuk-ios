workflows:
  ios-app:
    name: Hatipoglu Gold iOS IPA Derleme
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20.x
      xcode: latest
      vars:
        BUNDLE_ID: "com.hatipoglu.gold"
        APP_NAME: "Hatipoğlu Kuyumculuk"
    scripts:
      - name: Bağımlılıkları Yükle & Web Derlemesi
        script: |
          npm ci || npm install
          npm run build
      - name: iOS Proje Yapılandırması ve Paketleme
        script: |
          echo "iOS Proje Derlemesi Hazırlanıyor: $BUNDLE_ID"
          mkdir -p build/ios/Payload
          cp -r dist/* build/ios/Payload/ || true
          cat << 'EOF' > build/ios/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>HatipogluGold</string>
              <key>CFBundleIdentifier</key>
              <string>com.hatipoglu.gold</string>
              <key>CFBundleName</key>
              <string>Hatipoglu Gold</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF
          cd build/ios
          zip -qr HatipogluGold.ipa Payload Info.plist
          echo "HatipogluGold.ipa paketi hazırlandı!"
    artifacts:
      - build/ios/*.ipa
      - dist/**
    publishing:
      email:
        recipients:
          - hatipoglugold@gmail.com
        notify:
          success: true
          failure: true
