workflows:
  ios-release:
    name: Hatipoglu Gold - iOS Release & TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.hatipoglu.gold"
      node: 20.x
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web application
        script: npm run build
      - name: Build iOS IPA
        script: xcode-project build-ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - cicekgold@hotmail.com
          - hatipoglugold@gmail.com
